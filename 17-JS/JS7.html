<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a=0
        let b=1
        let sum
        document.write("<br>The series is: ")
        document.write(a)
        document.write(b)
        for(i=0;i<10;i++){
            sum = a+b
            document.write(sum)
            a=b;
            b=sum
        }
    </script>
</body>
</html>
