<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let k=0;
        let j=k++
        document.write("The value after increment: ",j)
        j=++k
        document.write("<br>The value after preincrement:",j)
        k++;
        document.write("<br>k++:",k)
        ++k;
        document.write("<br>++k",k)
    </script>
</body>
</html>
