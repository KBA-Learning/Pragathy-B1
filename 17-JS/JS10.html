<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num=153,reverse=0
        for(;num>0;){
            r=num%10
            reverse = (reverse*10) +r
            num = Math.floor(num/10)
        }
        document.write("<br> The reversed number is: ",reverse)
    </script>
</body>
</html>
