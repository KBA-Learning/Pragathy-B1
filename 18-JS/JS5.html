<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a =[],k=2
        for(i=0;i<5;i++){
            a[i] = k
            k=k+2
        }
        document.write("The array is:",a)
        document.write("<br>The array after incrementing:")
        for(i=0;i<5;i++){
            a[i]=a[i]+2
        }
        document.write(a)

        let sum=0
        for(i=0;i<5;i++){
            sum = sum+a[i]
        }
        document.write("<br>The sum of elements in array is: ",sum)
    </script>
</body>
