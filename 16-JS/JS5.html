<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a=22
        switch(a%2 == 0){
            case true:
                document.write("The number is even")
                break
            case false:
                document.write("The number is odd")
                break
            default:
                document.write("Neither even nor odd")
        }
    </script>
</body>
</html>
