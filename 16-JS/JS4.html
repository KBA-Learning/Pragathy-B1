<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a=10,b=5,result
        let op='/'
        switch(op){
            case '+':
                result=a+b
                document.write("The sum is: ",result)
                break
            case '*':
                 result=a*b
                document.write("The product is: ",result)
                break
            case '/':
                 result=a/b
                document.write("The quotient is: ",result)
                break
            case '%':
                 result=a%b
                document.write("The remainder is: ",result)
                break
            case '-':
                 result=a-b
                document.write("The difference is: ",result)
                break
            default:
                document.write("Unidentified Operation")
        }
    </script>
</body>
</html>
