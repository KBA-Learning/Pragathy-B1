<body>
    <script>
        let x=[2,4,6,8]
        document.write("<br>The element at second position:",x[1])

        document.write("<br>The array is:",x)
        x.pop()
         document.write("<br>The array is:",x)

        document.write("<br>The sum of 2 elements in 2nd & 3rd position is: ",sum)
    </script>
