<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let score = 64
        if(score>=90){
            document.write("<br> A+")
        }
        else if(score>=80 && score<90){
            document.write("<br> A")
        }
        else if(score>=70 && score<80){
            document.write("<br> B+")
        }
        else if(score>=60 && score<70){
            document.write("<br> B")
        }
        else{
            document.write("<br> C")
        }
    </script>
</body>
</html>
