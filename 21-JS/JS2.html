<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a=[8,9,3,10,2,1]

        for(i=0;i<a.length;i++){
            for(j=0;j<a.length-i;j++){
                if(a[j]>a[j+1]){
                    temp=a[j]
                    a[j]=a[j+1]
                    a[j+1]=temp
                }
            }
        }
        document.write("<br>The sorted array is:",a)
    </script>
</body>
</html>
