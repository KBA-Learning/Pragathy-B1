<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
       let a=[[1,2,3],[4,5,6],[7,8,9]],sum=0
       for(i=0;i<3;i++){
        for(j=0;j<3;j++){
            if(i==j){
                sum=sum+a[i][j]
            }
        }
       }
       document.write("<br>The sum of diagonal elements is: ",sum)
    </script>
</body>
</html>
